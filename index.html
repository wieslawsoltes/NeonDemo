const vec3 COL_CORE    = vec3(1.000, 0.930, 0.840);

float fmod(float x, float y) { return x - y * floor(x / y); }
vec3 fmod3(vec3 x, float y) { return x - y * floor(x / y); }
mat2 rot2(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}
float smax(float a, float b, float k) { return -smin(-a, -b, k); }

float sdBox(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}
float sdTorus(vec3 p, vec2 t) {
  vec2 q = vec2(length(p.xz) - t.x, p.y);
  return length(q) - t.y;
}

vec3 neonPalette(float t) {
  vec3 c1 = mix(COL_CRIMSON, COL_CYAN, 0.5 + 0.5 * sin(t));
  vec3 c2 = mix(COL_VIOLET, COL_PLASMA, 0.5 + 0.5 * cos(t * 0.7 + 1.2));
  return mix(c1, c2, 0.35 + 0.25 * sin(t * 1.7));
}

struct HitInfo {
  float d;
  float mat;
  float glowDist;
  vec3 glowCol;
};

vec2 conduitPath(float z) {
  return vec2(
    sin(z * 0.16) * 2.1 + cos(z * 0.075) * 1.1,
    cos(z * 0.13) * 1.5 + sin(z * 0.065) * 0.8
  );
}

HitInfo mapAct1(vec3 p, float t, float beat) {
  vec2 pathXY = conduitPath(p.z);
  p.xy -= pathXY;
  float twist = p.z * 0.14 + sin(t * 0.45) * 0.6;
  p.xy = rot2(twist) * p.xy;

  vec2 ap = abs(p.xy);
  float oct = max(max(ap.x, ap.y), (ap.x + ap.y) * 0.70710678);
  float tunnelRadius = 3.15 + 0.16 * sin(p.z * 0.45 - t * 3.0);
  float dWall = tunnelRadius - oct;

  float zCell = fmod(p.z + 1.2, 2.4) - 1.2;
  float groove = abs(zCell) - 0.06;
  float angle = atan(p.y, p.x);
  float angGroove = abs(sin(angle * 4.0)) - 0.04;
  dWall += 0.055 * smoothstep(0.06, 0.0, groove) + 0.035 * smoothstep(0.05, 0.0, angGroove);

  float ribZ = fmod(p.z + 1.2, 2.4) - 1.2;
  float ribRing = length(vec2(oct - (tunnelRadius - 0.14), ribZ)) - (0.065 + 0.025 * beat);

  float beamAngle = fmod(angle + 3.14159265 + p.z * 0.18 - t * 1.4, 1.5707963) - 0.78539816;
  float rad = length(p.xy);
  float dBeams = length(vec2(rad - 2.35, beamAngle * 2.35)) - 0.045;

  float gateZ = fmod(p.z + 4.8, 9.6) - 4.8;
  vec2 gRot = rot2(t * 1.2 + floor((p.z + 4.8) / 9.6) * 0.785) * p.xy;
  vec2 ga = abs(gRot);
  float gateOct = max(max(ga.x, ga.y), (ga.x + ga.y) * 0.70710678);
  float dGate = max(abs(gateOct - 1.55) - 0.055, abs(gateZ) - 0.08);

  float dNeon = min(ribRing, min(dBeams, dGate));
  float wave = sin(p.z * 0.35 - t * 6.5);
  vec3 gCol = mix(COL_CYAN, COL_CRIMSON, smoothstep(-0.35, 0.35, wave));
  if (dGate < ribRing && dGate < dBeams) {
    gCol = mix(COL_PLASMA, COL_CORE, 0.35 + 0.45 * beat);
  } else if (dBeams < ribRing) {
    gCol = mix(COL_VIOLET, COL_CYAN, 0.5 + 0.5 * sin(p.z * 0.6 - t * 9.0));
  }

  HitInfo res;
  if (dNeon < dWall) { res.d = dNeon; res.mat = 1.0; }
  else { res.d = dWall; res.mat = 0.0; }
  res.glowDist = dNeon;
  res.glowCol = gCol;
  return res;
}

float sdGeminiStar(vec3 p_in, float beat) {
  float scale = 1.0 + 0.09 * beat;
  vec3 p = p_in / scale;
  vec3 q = abs(p);
  float dOct = (q.x * 0.92 + q.y * 0.92 + q.z * 1.52 - 1.58) * 0.54;
  float dScoop = length(q.xy - vec2(1.24, 1.24)) - 1.02;
  float dScoopXZ = length(vec2(q.x, q.z * 1.35) - vec2(1.28, 1.15)) - 0.96;
  float dScoopYZ = length(vec2(q.y, q.z * 1.35) - vec2(1.28, 1.15)) - 0.96;
  float carved = smax(dOct, -dScoop, 0.06);
  return smax(carved, -min(dScoopXZ, dScoopYZ), 0.08) * scale;
}

HitInfo mapAct2(vec3 p, float t, float beat) {
  float dFloor = p.y + 2.35;

  vec3 sp = p - vec3(0.0, 0.35 + 0.14 * sin(t * 1.7), 0.0);
  sp.xz = rot2(t * 0.65) * sp.xz;
  sp.yz = rot2(sin(t * 0.9) * 0.28) * sp.yz;

  float dStar = sdGeminiStar(sp, beat);
  float dInnerCore = length(sp) - (0.38 + 0.14 * beat);

  vec3 centerP = p - vec3(0.0, 0.35, 0.0);
  vec3 r1 = centerP;
  r1.xy = rot2(t * 0.95) * r1.xy;
  r1.yz = rot2(0.75 + t * 0.45) * r1.yz;
  float dRing1 = sdTorus(r1, vec2(2.35, 0.048 + 0.018 * beat));

  vec3 r2 = centerP;
  r2.xz = rot2(-t * 1.25) * r2.xz;
  r2.xy = rot2(-0.85 + sin(t * 0.6) * 0.5) * r2.xy;
  float dRing2 = sdTorus(r2, vec2(2.95, 0.042 + 0.015 * beat));

  vec3 r3 = centerP;
  r3.yz = rot2(t * 0.55) * r3.yz;
  r3.xz = rot2(1.1 - t * 0.7) * r3.xz;
  float dRing3 = sdTorus(r3, vec2(3.55, 0.036 + 0.014 * beat));

  float ang = atan(p.z, p.x);
  float sector = 6.2831853 / 8.0;
  float sectorId = floor((ang + sector * 0.5) / sector);
  float localAng = fmod(ang + sector * 0.5, sector) - sector * 0.5;
  float radXZ = length(p.xz);
  float bob = sin(t * 1.15 + sectorId * 1.35) * 0.35;
  vec3 mp = vec3(cos(localAng) * radXZ - 6.9, p.y - (0.3 + bob), sin(localAng) * radXZ);
  float dMono = sdBox(mp, vec3(0.55, 2.55, 0.55)) - 0.08;
  float dMonoSlit = sdBox(mp - vec3(-0.56, 0.0, 0.0), vec3(0.05, 2.1, 0.065));

  float dRings = min(dRing1, min(dRing2, dRing3));
  float dNeon = min(dInnerCore, min(dRings, dMonoSlit));

  vec3 gCol = COL_CYAN;
  if (dInnerCore < dRings && dInnerCore < dMonoSlit) gCol = mix(COL_PLASMA, COL_CORE, 0.55 + 0.35 * beat);
  else if (dRing1 <= dRing2 && dRing1 <= dRing3 && dRing1 <= dMonoSlit) gCol = COL_CYAN;
  else if (dRing2 <= dRing3 && dRing2 <= dMonoSlit) gCol = COL_CRIMSON;
  else if (dRing3 <= dMonoSlit) gCol = COL_VIOLET;
  else gCol = mix(COL_CRIMSON, COL_CYAN, 0.5 + 0.5 * sin(sectorId * 1.57 + t * 1.5));

  float glowDist = min(dNeon, max(dStar, 0.02) * 1.35);
  if (dStar < dNeon) gCol = mix(gCol, mix(COL_PLASMA, COL_CRIMSON, 0.45), 0.5);

  HitInfo res;
  res.d = dFloor; res.mat = 2.0;
  if (dMono < res.d) { res.d = dMono; res.mat = 0.0; }
  if (dStar < res.d) { res.d = dStar; res.mat = 3.0; }
  if (dNeon < res.d) { res.d = dNeon; res.mat = 1.0; }
  res.glowDist = glowDist;
  res.glowCol = gCol;
  return res;
}

HitInfo mapAct3(vec3 p, float t, float beat) {
  vec2 camPath = vec2(sin(p.z * 0.22) * 0.9, cos(p.z * 0.19) * 0.9);
  float corridorDist = 1.15 - length(p.xy - camPath);

  float waveZ = floor(p.z / 12.0) * 12.0 + 6.0;
  vec3 waveOrigin = vec3(sin(waveZ * 0.22) * 0.9, cos(waveZ * 0.19) * 0.9, waveZ);
  float waveRad = fmod(t * 4.8, 5.5);
  float dShock = abs(length(p - waveOrigin) - waveRad) - (0.045 + 0.04 * beat);

  vec3 q = fmod3(p + 3.0, 6.0) - 3.0;
  float scale = 1.0;
  float trap = 1e5;
  float foldAngle = 0.35 + 0.16 * sin(t * 0.6) + 0.08 * beat;
  mat2 rFold1 = rot2(foldAngle);
  mat2 rFold2 = rot2(-foldAngle * 0.7 + 0.4);

  for (int i = 0; i < 4; i++) {
    q = abs(q);
    if (q.x < q.y) q.xy = q.yx;
    if (q.x < q.z) q.xz = q.zx;
    if (q.y < q.z) q.yz = q.zy;
    q.xy = rFold1 * q.xy;
    q = q * 1.92 - vec3(1.78, 1.42, 0.95);
    if (q.z < -0.5 * 1.92) q.z += 1.92;
    q.xz = rFold2 * q.xz;
    scale *= 1.92;
    trap = min(trap, length(q.xy));
  }

  float dFractalRaw = (sdBox(q, vec3(0.95)) - 0.08) / scale;
  float dFractal = smax(dFractalRaw, corridorDist, 0.25);
  float dVeins = max(dFractal, abs(trap - 0.35) * 0.14);
  float dNeon = min(dShock, dVeins + 0.015);

  vec3 gCol = neonPalette(trap * 2.4 + p.z * 0.22 - t * 2.5);
  if (dShock < dVeins) gCol = mix(COL_PLASMA, COL_CORE, 0.55 + 0.35 * beat);

  HitInfo res;
  if (dShock < dFractal) { res.d = dShock; res.mat = 1.0; }
  else { res.d = dFractal; res.mat = 0.0; }
  res.glowDist = dNeon;
  res.glowCol = gCol;
  return res;
}

HitInfo mapScene(int actId, vec3 p, float t, float beat) {
  if (actId == 0) return mapAct1(p, t, beat);
  if (actId == 1) return mapAct2(p, t, beat);
  return mapAct3(p, t, beat);
}

vec3 calcNormal(int actId, vec3 p, float t, float beat) {
  float e = 0.0025;
  vec2 k = vec2(1.0, -1.0);
  return normalize(
    k.xyy * mapScene(actId, p + k.xyy * e, t, beat).d +
    k.yyx * mapScene(actId, p + k.yyx * e, t, beat).d +
    k.yxy * mapScene(actId, p + k.yxy * e, t, beat).d +
    k.xxx * mapScene(actId, p + k.xxx * e, t, beat).d +
    vec3(1e-5)
  );
}

vec3 renderAct(int actId, vec2 uv, float t, float beat, float bass, float overdrive) {
  float aspect = uTrans.z;
  vec2 pUV = (uv - 0.5) * vec2(aspect, 1.0) * 2.0;
  float mx = uCamAct.x;
  float my = uCamAct.y;

  float shakeAmp = (0.008 + 0.014 * float(actId == 2)) * beat * overdrive;
  pUV += vec2(sin(t * 57.0), cos(t * 63.0)) * shakeAmp;

  vec3 ro = vec3(0.0);
  vec3 ta = vec3(0.0, 0.0, 1.0);
  float roll = 0.0;
  float fov = 1.35;

  if (actId == 0) {
    float zPos = t * 9.5;
    vec2 c0 = conduitPath(zPos);
    vec2 c1 = conduitPath(zPos + 3.2);
    ro = vec3(c0.x + mx * 0.75, c0.y + my * 0.65, zPos);
    ta = vec3(c1.x + mx * 1.4, c1.y + my * 1.1, zPos + 3.2);
    roll = sin(t * 0.55) * 0.48 - mx * 0.35;
    fov = 1.22 - 0.14 * beat;
  } else if (actId == 1) {
    float orbitAng = t * 0.34 + mx * 1.65;
    float orbitRad = 6.35 + sin(t * 0.42) * 1.15 - beat * 0.25;
    float camY = 0.55 + sin(t * 0.31) * 1.25 + my * 1.85;
    ro = vec3(cos(orbitAng) * orbitRad, max(-1.75, camY), sin(orbitAng) * orbitRad);
    ta = vec3(0.0, 0.25, 0.0);
    roll = sin(t * 0.28) * 0.08 - mx * 0.1;
    fov = 1.45 - 0.08 * beat;
  } else {
    float zPos = t * 6.8;
    vec2 c0 = vec2(sin(zPos * 0.22) * 0.9, cos(zPos * 0.19) * 0.9);
    vec2 c1 = vec2(sin((zPos + 2.5) * 0.22) * 0.9, cos((zPos + 2.5) * 0.19) * 0.9);
    ro = vec3(c0.x + mx * 0.45, c0.y + my * 0.45, zPos);
    ta = vec3(c1.x + mx * 1.2, c1.y + my * 1.2, zPos + 2.5);
    roll = t * 0.42 + sin(t * 1.3) * 0.45 - mx * 0.5;
    fov = 1.08 + 0.22 * sin(t * 0.9) - 0.18 * beat;
  }

  vec3 cw = normalize(ta - ro);
  vec3 upRef = vec3(sin(roll), cos(roll), 0.0);
  vec3 cu = normalize(cross(cw, upRef));
  vec3 cv = normalize(cross(cu, cw));
  vec3 rd = normalize(cu * pUV.x + cv * pUV.y + cw * fov);

  float dist = 0.0;
  float hitMat = -1.0;
  vec3 hitPos = ro;
  vec3 glowAccum = vec3(0.0);
  float maxDist = 48.0;

  for (int i = 0; i < 82; i++) {
    vec3 p = ro + rd * dist;
    HitInfo h = mapScene(actId, p, t, beat);
    float gStep = 0.011 / (0.028 + h.glowDist * h.glowDist * 4.2);
    glowAccum += h.glowCol * gStep * (0.75 + 0.55 * beat);
    if (h.d < 0.0022) {
      hitMat = h.mat;
      hitPos = p;
      break;
    }
    dist += h.d * 0.88;
    if (dist > maxDist) break;
  }

  vec3 col = COL_VOID + mix(COL_VIOLET, COL_CYAN, 0.5 + 0.5 * rd.y) * 0.045;

  if (hitMat >= 0.0) {
    vec3 n = calcNormal(actId, hitPos, t, beat);
    vec3 viewDir = -rd;
    float fresnel = pow(max(1.0 - max(dot(n, viewDir), 0.0), 0.0), 3.4);
    vec3 refl = reflect(rd, n);

    if (hitMat == 1.0) {
      HitInfo hInfo = mapScene(actId, hitPos, t, beat);
      col = mix(hInfo.glowCol, COL_CORE, 0.45 + 0.35 * fresnel) * (2.4 + 1.4 * beat);
    } else if (hitMat == 3.0) {
      vec3 l1 = normalize(vec3(0.6, 0.8, 0.5));
      vec3 l2 = normalize(vec3(-0.7, -0.3, -0.6));
      float spec1 = pow(max(dot(refl, l1), 0.0), 36.0);
      float spec2 = pow(max(dot(refl, l2), 0.0), 22.0);
      vec3 corePulse = mix(COL_PLASMA, COL_CORE, 0.4 + 0.5 * beat);
      vec3 rimCol = mix(COL_CYAN, COL_CRIMSON, 0.5 + 0.5 * sin(hitPos.y * 2.5 - t * 2.0));
      float coreGlow = exp(-length(hitPos - vec3(0.0, 0.35, 0.0)) * 1.15);
      col = vec3(0.05, 0.02, 0.10)
          + corePulse * coreGlow * (1.85 + 1.3 * beat)
          + rimCol * fresnel * (2.6 + 1.2 * bass)
          + COL_CORE * spec1 * 1.8
          + COL_CYAN * spec2 * 1.1;
    } else if (hitMat == 2.0) {
      vec2 gridXZ = abs(fract(hitPos.xz * 0.65 - 0.5) - 0.5) / 0.65;
      float gridLine = smoothstep(0.032, 0.004, min(gridXZ.x, gridXZ.y));
      float radFloor = length(hitPos.xz);
      float pulseRing = smoothstep(0.18, 0.0, abs(fmod(radFloor - t * 3.8, 5.2) - 2.6));
      vec3 gridCol = mix(COL_VIOLET, COL_CYAN, 0.5 + 0.5 * sin(radFloor * 0.45 - t * 2.2));
      vec3 floorEmissive = gridCol * gridLine * (0.55 + 0.9 * pulseRing * (0.6 + beat)) * exp(-radFloor * 0.085);

      float rDist = 0.06;
      vec3 reflGlow = vec3(0.0);
      vec3 reflHitCol = COL_VOID;
      for (int j = 0; j < 30; j++) {
        vec3 rp = hitPos + n * 0.02 + refl * rDist;
        HitInfo rh = mapAct2(rp, t, beat);
        reflGlow += rh.glowCol * (0.015 / (0.035 + rh.glowDist * rh.glowDist * 3.8));
        if (rh.d < 0.012) {
          if (rh.mat == 1.0 || rh.mat == 3.0) reflHitCol = mix(rh.glowCol, COL_CORE, 0.35) * 1.8;
          else reflHitCol = vec3(0.03, 0.02, 0.06);
          break;
        }
        rDist += rh.d * 1.1;
        if (rDist > 22.0) break;
      }
      float mirrorStrength = 0.35 + 0.62 * fresnel;
      col = vec3(0.012, 0.010, 0.024) + floorEmissive + (reflHitCol + reflGlow * 0.68) * mirrorStrength;
    } else {
      vec3 lDir = normalize(vec3(0.3, 0.7, -0.5));
      float diff = max(dot(n, lDir), 0.0);
      float spec = pow(max(dot(refl, lDir), 0.0), 28.0);
      vec3 bounceCol = neonPalette(hitPos.z * 0.25 - t * 1.5);
      vec3 rimCol = mix(COL_CYAN, COL_CRIMSON, 0.5 + 0.5 * sin(hitPos.z * 0.3 + hitPos.y));
      col = vec3(0.020, 0.016, 0.042)
          + bounceCol * diff * 0.22
          + rimCol * fresnel * (1.15 + 0.85 * bass)
          + COL_CORE * spec * 0.65;
      if (actId == 2) {
        float edgePulse = smoothstep(0.35, 0.95, abs(sin(hitPos.z * 1.2 - t * 5.0)));
        col += mix(COL_CRIMSON, COL_CYAN, edgePulse) * fresnel * (0.8 + beat);
      }
    }

    float fogDensity = (actId == 2) ? 0.0034 : 0.0022;
    float fogAmount = 1.0 - exp(-dist * dist * fogDensity);
    vec3 fogCol = mix(COL_VOID, mix(COL_VIOLET, COL_CYAN, 0.35) * 0.22, 0.45 + 0.35 * bass);
    col = mix(col, fogCol, clamp(fogAmount, 0.0, 1.0));
  }

  col += glowAccum * (0.48 * overdrive);

  if (actId == 2) {
    float r = length(pUV);
    float ang = atan(pUV.y, pUV.x);
    float rays = pow(max(0.0, cos(ang * 6.0 + t * 2.2)), 6.0);
    float flare = exp(-r * 2.8) * (0.28 + 0.65 * beat) * overdrive;
    col += mix(COL_CRIMSON, COL_CYAN, 0.5 + 0.5 * sin(ang * 3.0 - t)) * rays * flare;
    col += COL_PLASMA * exp(-r * 6.5) * 0.45 * beat * overdrive;
  }

  if (actId == 0) {
    float r = length(pUV);
    float ang = atan(pUV.y, pUV.x);
    float streak = pow(max(0.0, sin(ang * 24.0 + sin(t * 2.0))), 14.0) * smoothstep(0.45, 1.45, r);
    float streakPulse = 0.5 + 0.5 * sin(ang * 7.0 - t * 12.0);
    col += mix(COL_CYAN, COL_CRIMSON, streakPulse) * streak * (0.22 + 0.45 * beat) * overdrive;
  }

  return col;
}

void main() {
  float t = uResTime.z;
  float beat = uAudioCtrl.x;
  float bass = uAudioCtrl.y;
  float overdrive = uAudioCtrl.z;
  int curAct = int(floor(uCamAct.z + 0.5));
  int prvAct = int(floor(uCamAct.w + 0.5));
  float blend = uTrans.x;
  float flash = uTrans.y;

  vec2 uv = vUv;
  if (flash > 0.005) {
    vec2 dir = uv - 0.5;
    uv = 0.5 + dir * (1.0 - flash * 0.22 * length(dir));
  }

  vec3 col = renderAct(curAct, uv, t, beat, bass, overdrive);
  if (blend > 0.01 && prvAct != curAct) {
    vec3 prevCol = renderAct(prvAct, uv, t, beat, bass, overdrive);
    col = mix(col, prevCol, blend);
  }

  vec3 hdrEncoded = col / (1.0 + col * 0.45);
  fragColor = vec4(clamp(hdrEncoded, 0.0, 1.0), 1.0);
}
`;

      const GLSL_POST_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;

uniform sampler2D uSceneTex;
uniform vec4 uResTime;
uniform vec4 uAudioCtrl;
uniform vec4 uTrans;

vec3 decodeHDR(vec3 c) {
  return c / max(vec3(1.0) - c * 0.45, vec3(0.04));
}

vec3 acesFilm(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 uv = vUv;
  float t = uResTime.z;
  float beat = uAudioCtrl.x;
  float bass = uAudioCtrl.y;
  float overdrive = uAudioCtrl.z;
  float flash = uTrans.y;

  vec2 centerOffset = uv - 0.5;
  float distFromCenter = length(centerOffset);

  float caAmount = (0.0022 + 0.0085 * beat * overdrive + 0.024 * flash) * distFromCenter;
  vec2 caDir = normalize(centerOffset + vec2(1e-5)) * caAmount;

  float rS = decodeHDR(texture(uSceneTex, clamp(uv + caDir, 0.001, 0.999)).rgb).r;
  float gS = decodeHDR(texture(uSceneTex, uv).rgb).g;
  float bS = decodeHDR(texture(uSceneTex, clamp(uv - caDir, 0.001, 0.999)).rgb).b;
  vec3 col = vec3(rS, gS, bS);

  vec2 px = vec2(1.0 / max(uResTime.x, 1.0), 1.0 / max(uResTime.y, 1.0));
  vec3 b1 = decodeHDR(texture(uSceneTex, clamp(uv + vec2(px.x * 5.0, 0.0), 0.001, 0.999)).rgb);
  vec3 b2 = decodeHDR(texture(uSceneTex, clamp(uv - vec2(px.x * 5.0, 0.0), 0.001, 0.999)).rgb);
  vec3 b3 = decodeHDR(texture(uSceneTex, clamp(uv + vec2(px.x * 13.0, 0.0), 0.001, 0.999)).rgb);
  vec3 b4 = decodeHDR(texture(uSceneTex, clamp(uv - vec2(px.x * 13.0, 0.0), 0.001, 0.999)).rgb);
  vec3 b5 = decodeHDR(texture(uSceneTex, clamp(uv + vec2(0.0, px.y * 5.0), 0.001, 0.999)).rgb);
  vec3 b6 = decodeHDR(texture(uSceneTex, clamp(uv - vec2(0.0, px.y * 5.0), 0.001, 0.999)).rgb);
  vec3 b7 = decodeHDR(texture(uSceneTex, clamp(uv + vec2(px.x * 8.0, px.y * 8.0), 0.001, 0.999)).rgb);
  vec3 b8 = decodeHDR(texture(uSceneTex, clamp(uv - vec2(px.x * 8.0, px.y * 8.0), 0.001, 0.999)).rgb);

  vec3 bloom = (b1 + b2 + b5 + b6) * 0.14 + (b3 + b4) * 0.16 + (b7 + b8) * 0.08;
  col += max(bloom - 0.42, 0.0) * (0.42 + 0.25 * beat) * overdrive;

  if (flash > 0.001) {
    vec3 flashCol = mix(vec3(0.0, 0.96, 1.0), vec3(1.0, 0.25, 0.55), 0.5 + 0.5 * sin(t * 9.0));
    col += flashCol * flash * 1.45;
  }

  col = acesFilm(col * (0.95 + 0.15 * bass));
  col *= (0.965 + 0.035 * sin(uv.y * uResTime.y * 1.55));

  float grain = fract(sin(dot(uv * vec2(12.9898, 78.233) + t * 0.01, vec2(12.9898, 78.233))) * 43758.5453);
  col += (grain - 0.5) * 0.018;

  float vig = smoothstep(1.18, 0.28, distFromCenter * 1.25);
  col *= (0.58 + 0.42 * vig);
  col = pow(max(col, 0.0), vec3(0.94));
  fragColor = vec4(col, 1.0);
}
`;

      /* ============================================================================
       * 5. GPU BACKENDS: WEBGPU (PRIMARY) & WEBGL2 (SEAMLESS FALLBACK)
       * ============================================================================ */

      class WebGPURenderer {
        constructor(canvas) {
          this.canvas = canvas;
          this.device = null;
          this.context = null;
          this.format = null;
          this.uniformBuffer = null;
          this.scenePipeline = null;
          this.postPipeline = null;
          this.sceneBindGroup = null;
          this.postBindGroup = null;
          this.offscreenTex = null;
          this.sampler = null;
          this.width = 1;
          this.height = 1;
        }

        async init() {
          if (!navigator.gpu) {
            throw new Error('WebGPU API not available in this browser');
          }
          const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
          if (!adapter) {
            throw new Error('No WebGPU adapter found');
          }
          this.device = await adapter.requestDevice();
          this.context = this.canvas.getContext('webgpu');
          if (!this.context) {
            throw new Error('Could not obtain WebGPU canvas context');
          }
          this.format = navigator.gpu.getPreferredCanvasFormat();
          this.context.configure({
            device: this.device,
            format: this.format,
            alphaMode: 'opaque'
          });

          // Compile and validate both WGSL shader modules strictly
          const sceneMod = this.device.createShaderModule({ code: WGSL_SCENE_SHADER });
          const postMod = this.device.createShaderModule({ code: WGSL_POST_SHADER });

          if (sceneMod.getCompilationInfo) {
            const info1 = await sceneMod.getCompilationInfo();
            const err1 = info1.messages.find((m) => m.type === 'error');
            if (err1) throw new Error('WGSL Scene Error: ' + err1.message);
          }
          if (postMod.getCompilationInfo) {
            const info2 = await postMod.getCompilationInfo();
            const err2 = info2.messages.find((m) => m.type === 'error');
            if (err2) throw new Error('WGSL Post Error: ' + err2.message);
          }

          // 64-byte uniform buffer (4 x vec4<f32>)
          this.uniformBuffer = this.device.createBuffer({
            size: 64,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
          });

          this.sampler = this.device.createSampler({
            magFilter: 'linear',
            minFilter: 'linear',
            addressModeU: 'clamp-to-edge',
            addressModeV: 'clamp-to-edge'
          });

          this.device.pushErrorScope('validation');

          this.scenePipeline = this.device.createRenderPipeline({
            layout: 'auto',
            vertex: { module: sceneMod, entryPoint: 'vs_main' },
            fragment: {
              module: sceneMod,
              entryPoint: 'fs_main',
              targets: [{ format: 'rgba8unorm' }]
            },
            primitive: { topology: 'triangle-list' }
          });

          this.postPipeline = this.device.createRenderPipeline({
            layout: 'auto',
            vertex: { module: postMod, entryPoint: 'vs_main' },
            fragment: {
              module: postMod,
              entryPoint: 'fs_main',
              targets: [{ format: this.format }]
            },
            primitive: { topology: 'triangle-list' }
          });

          this.sceneBindGroup = this.device.createBindGroup({
            layout: this.scenePipeline.getBindGroupLayout(0),
            entries: [{ binding: 0, resource: { buffer: this.uniformBuffer } }]
          });

          const valErr = await this.device.popErrorScope();
          if (valErr) {
            throw new Error('WebGPU pipeline validation failed: ' + valErr.message);
          }

          this.resize(this.canvas.width || 640, this.canvas.height || 360);
          return true;
        }

        resize(w, h) {
          this.width = Math.max(2, Math.floor(w));
          this.height = Math.max(2, Math.floor(h));
          if (this.offscreenTex) {
            this.offscreenTex.destroy();
          }
          this.offscreenTex = this.device.createTexture({
            size: [this.width, this.height, 1],
            format: 'rgba8unorm',
            usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
          });
          this.postBindGroup = this.device.createBindGroup({
            layout: this.postPipeline.getBindGroupLayout(0),
            entries: [
              { binding: 0, resource: { buffer: this.uniformBuffer } },
              { binding: 1, resource: this.offscreenTex.createView() },
              { binding: 2, resource: this.sampler }
            ]
          });
        }

        render(uniformData) {
          this.device.queue.writeBuffer(this.uniformBuffer, 0, uniformData);
          const encoder = this.device.createCommandEncoder();

          // Pass 1: Raymarched 3D SDF Demoscene into Offscreen Texture
          const pass1 = encoder.beginRenderPass({
            colorAttachments: [{
              view: this.offscreenTex.createView(),
              clearValue: { r: 0.01, g: 0.007, b: 0.024, a: 1.0 },
              loadOp: 'clear',
              storeOp: 'store'
            }]
          });
          pass1.setPipeline(this.scenePipeline);
          pass1.setBindGroup(0, this.sceneBindGroup);
          pass1.draw(3, 1, 0, 0);
          pass1.end();

          // Pass 2: Cinematic Post-Processing (Chromatic Aberration + Bloom + ACES)
          const swapView = this.context.getCurrentTexture().createView();
          const pass2 = encoder.beginRenderPass({
            colorAttachments: [{
              view: swapView,
              clearValue: { r: 0, g: 0, b: 0, a: 1 },
              loadOp: 'clear',
              storeOp: 'store'
            }]
          });
          pass2.setPipeline(this.postPipeline);
          pass2.setBindGroup(0, this.postBindGroup);
          pass2.draw(3, 1, 0, 0);
          pass2.end();

          this.device.queue.submit([encoder.finish()]);
        }
      }

      class WebGL2Renderer {
        constructor(canvas) {
          this.canvas = canvas;
          this.gl = null;
          this.sceneProg = null;
          this.postProg = null;
          this.fbo = null;
          this.offscreenTex = null;
          this.vao = null;
          this.width = 1;
          this.height = 1;
          this.sceneLocs = {};
          this.postLocs = {};
        }

        compile(type, src) {
          const gl = this.gl;
          const sh = gl.createShader(type);
          gl.shaderSource(sh, src);
          gl.compileShader(sh);
          if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
            const log = gl.getShaderInfoLog(sh);
            gl.deleteShader(sh);
            throw new Error('GLSL compile error: ' + log);
          }
          return sh;
        }

        link(vsSrc, fsSrc) {
          const gl = this.gl;
          const vs = this.compile(gl.VERTEX_SHADER, vsSrc);
          const fs = this.compile(gl.FRAGMENT_SHADER, fsSrc);
          const prog = gl.createProgram();
          gl.attachShader(prog, vs);
          gl.attachShader(prog, fs);
          gl.linkProgram(prog);
          gl.deleteShader(vs);
          gl.deleteShader(fs);
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
            throw new Error('GLSL link error: ' + gl.getProgramInfoLog(prog));
          }
          return prog;
        }

        async init() {
          const gl = this.canvas.getContext('webgl2', {
            antialias: false,
            depth: false,
            stencil: false,
            alpha: false,
            powerPreference: 'high-performance'
          });
          if (!gl) {
            throw new Error('WebGL2 context unavailable on this device');
          }
          this.gl = gl;
          this.sceneProg = this.link(GLSL_FULLSCREEN_VS, GLSL_SCENE_FS);
          this.postProg = this.link(GLSL_FULLSCREEN_VS, GLSL_POST_FS);

          this.sceneLocs = {
            uResTime: gl.getUniformLocation(this.sceneProg, 'uResTime'),
            uAudioCtrl: gl.getUniformLocation(this.sceneProg, 'uAudioCtrl'),
            uCamAct: gl.getUniformLocation(this.sceneProg, 'uCamAct'),
            uTrans: gl.getUniformLocation(this.sceneProg, 'uTrans')
          };
          this.postLocs = {
            uSceneTex: gl.getUniformLocation(this.postProg, 'uSceneTex'),
            uResTime: gl.getUniformLocation(this.postProg, 'uResTime'),
            uAudioCtrl: gl.getUniformLocation(this.postProg, 'uAudioCtrl'),
            uTrans: gl.getUniformLocation(this.postProg, 'uTrans')
          };

          this.vao = gl.createVertexArray();
          this.fbo = gl.createFramebuffer();
          this.offscreenTex = gl.createTexture();
          this.resize(this.canvas.width || 640, this.canvas.height || 360);
          return true;
        }

        resize(w, h) {
          const gl = this.gl;
          this.width = Math.max(2, Math.floor(w));
          this.height = Math.max(2, Math.floor(h));
          gl.bindTexture(gl.TEXTURE_2D, this.offscreenTex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, this.width, this.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

          gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.offscreenTex, 0);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        }

        render(u) {
          const gl = this.gl;
          gl.bindVertexArray(this.vao);

          // Pass 1: Scene to Offscreen Framebuffer
          gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo);
          gl.viewport(0, 0, this.width, this.height);
          gl.useProgram(this.sceneProg);
          gl.uniform4f(this.sceneLocs.uResTime, u[0], u[1], u[2], u[3]);
          gl.uniform4f(this.sceneLocs.uAudioCtrl, u[4], u[5], u[6], u[7]);
          gl.uniform4f(this.sceneLocs.uCamAct, u[8], u[9], u[10], u[11]);
          gl.uniform4f(this.sceneLocs.uTrans, u[12], u[13], u[14], u[15]);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          // Pass 2: Cinematic Post-Processing to Screen
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, this.canvas.width, this.canvas.height);
          gl.useProgram(this.postProg);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, this.offscreenTex);
          gl.uniform1i(this.postLocs.uSceneTex, 0);
          gl.uniform4f(this.postLocs.uResTime, u[0], u[1], u[2], u[3]);
          gl.uniform4f(this.postLocs.uAudioCtrl, u[4], u[5], u[6], u[7]);
          gl.uniform4f(this.postLocs.uTrans, u[12], u[13], u[14], u[15]);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
      }

        if (canvas.width !== targetW || canvas.height !== targetH) {

        actLabelEl.textContent = ACT_META[newAct].title;

        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

      // Interactive Mouse & Touch Camera Parallax + Orbit Drag

        const nx = (e.clientX / window.innerWidth) * 2 - 1;
        const ny = -((e.clientY / window.innerHeight) * 2 - 1);
        state.mouseTargetX = nx * 0.55;
        state.mouseTargetY = ny * 0.45;
        if (state.isDragging) {
          const dx = (e.clientX - state.lastPointerX) / window.innerWidth;
          const dy = (e.clientY - state.lastPointerY) / window.innerHeight;
          state.dragOffsetX = Math.max(-1.6, Math.min(1.6, state.dragOffsetX + dx * 2.6));
          state.dragOffsetY = Math.max(-0.9, Math.min(0.9, state.dragOffsetY - dy * 2.0));
          state.lastPointerX = e.clientX;
          state.lastPointerY = e.clientY;
        }
      });

      canvas.addEventListener('mousedown', (e) => {
        state.isDragging = true;
        state.lastPointerX = e.clientX;
        state.lastPointerY = e.clientY;
      });
      window.addEventListener('mouseup', () => { state.isDragging = false; });

      canvas.addEventListener('dblclick', () => {
        state.dragOffsetX = 0;

      // Touch drag support for mobile / tablet
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          state.isDragging = true;
          state.lastPointerX = e.touches[0].clientX;
          state.lastPointerY = e.touches[0].clientY;
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (state.isDragging && e.touches.length === 1) {
          const tx = e.touches[0].clientX;
          const ty = e.touches[0].clientY;
          const dx = (tx - state.lastPointerX) / window.innerWidth;
          const dy = (ty - state.lastPointerY) / window.innerHeight;
          state.dragOffsetX = Math.max(-1.6, Math.min(1.6, state.dragOffsetX + dx * 2.8));
          state.dragOffsetY = Math.max(-0.9, Math.min(0.9, state.dragOffsetY - dy * 2.2));
          state.lastPointerX = tx;
          state.lastPointerY = ty;
        }
      }, { passive: true });

      canvas.addEventListener('touchend', () => { state.isDragging = false; });

      window.addEventListener('resize', updateCanvasSize);

      /* ============================================================================
       * 7. ENGINE BOOTSTRAP & MAIN 60FPS ANIMATION LOOP
       * ============================================================================ */
      async function bootEngine() {
        updateCanvasSize();

        // Try WebGPU WGSL Primary Backend First
        let initialized = false;
        try {
          const gpuRenderer = new WebGPURenderer(canvas);
          await gpuRenderer.init();
          renderer = gpuRenderer;
          state.backend = 'WEBGPU WGSL';
          backendLabel.textContent = 'WEBGPU WGSL';
          metaShaderTag.textContent = 'WGSL RAYMARCH';
          backendDot.className = 'w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#00f5ff]';
          initialized = true;
        } catch (gpuErr) {
          // Seamless automatic fallback to WebGL2 GLSL
          try {
            const glRenderer = new WebGL2Renderer(canvas);
            await glRenderer.init();
            renderer = glRenderer;
            state.backend = 'WEBGL2 FALLBACK';
            backendLabel.textContent = 'WEBGL2 FALLBACK';
            backendLabel.classList.remove('text-cyan-200');
            backendLabel.classList.add('text-amber-300');
            metaShaderTag.textContent = 'GLSL RAYMARCH';
            backendDot.className = 'w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_8px_#ff9900]';
            initialized = true;
          } catch (glErr) {
            fatalErrorMsg.textContent =
              'Neither WebGPU nor WebGL2 could be initialized in this browser environment. Please enable hardware acceleration or use a modern GPU-capable browser.';
            fatalErrorBox.classList.remove('hidden');
            fatalErrorBox.classList.add('flex');
            return;
          }
        }

        if (!initialized) return;
        updateCanvasSize();
        startLoop();
      }

      function formatClock(sec) {
        const s = Math.floor(sec % 60);
        const m = Math.floor(sec / 60);
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      function startLoop() {
        let lastTime = performance.now();
        let frameIdx = 0;

        function frame(now) {
          requestAnimationFrame(frame);
          const rawDt = Math.min(0.05, Math.max(0.001, (now - lastTime) * 0.001));
          lastTime = now;

          // Update Demo Clocks
          if (state.playing) {
            state.demoTime += rawDt;
            state.shaderTime += rawDt * state.speed;
          }

          // Smooth Interactive Camera Parallax Damping
          const desiredX = state.mouseTargetX + state.dragOffsetX;
          const desiredY = state.mouseTargetY + state.dragOffsetY;
          const damp = 1.0 - Math.exp(-rawDt * 6.5);
          state.mouseX += (desiredX - state.mouseX) * damp;
          state.mouseY += (desiredY - state.mouseY) * damp;

          // Auto Demoscene 3-Act Choreography
          const cyclePos = state.demoTime % TOTAL_DEMO_CYCLE;
          progressBarEl.style.width = ((cyclePos / TOTAL_DEMO_CYCLE) * 100).toFixed(1) + '%';
          demoClockEl.textContent = formatClock(state.demoTime);

          if (state.sceneMode === 'auto') {
            let targetAct = 0;
            if (cyclePos >= ACT_META[0].duration + ACT_META[1].duration) {
              targetAct = 2;
            } else if (cyclePos >= ACT_META[0].duration) {
              targetAct = 1;
            }
            if (targetAct !== state.currentAct) {
              triggerActSwitch(targetAct);
            }
          }

          // Smooth Transition Cross-Fade & Shockwave Flash Decay
          if (state.transitionBlend > 0.0) {
            state.transitionBlend = Math.max(0.0, state.transitionBlend - rawDt * 1.45);
          }
          if (state.transitionFlash > 0.0) {
            state.transitionFlash = Math.max(0.0, state.transitionFlash - rawDt * 1.9);
          }

          // Sample Real-Time Web Audio Synth or Synthetic 128 BPM Pulse
          const audio = synth.sampleEnergy(state.demoTime);
          state.beatPulse += (audio.beatPulse - state.beatPulse) * (1.0 - Math.exp(-rawDt * 22.0));
          state.bassEnergy += (audio.bassEnergy - state.bassEnergy) * (1.0 - Math.exp(-rawDt * 14.0));

          // Update Beat LED & Mini Audio Equalizer Bars
          const ledScale = 1.0 + state.beatPulse * 0.55;
          beatLedEl.style.transform = `scale(${ledScale.toFixed(2)})`;
          if (synth.enabled) {
            for (let i = 0; i < eqBars.length; i++) {
              const h = 3 + Math.round((audio.bars[i] || 0.1) * 10);
              eqBars[i].style.height = h + 'px';
            }
          }

          // Pack 16-Byte Aligned Uniform Buffer (4 x vec4<f32>)
          const w = canvas.width;
          const h = canvas.height;
          uniformData[0] = w;
          uniformData[1] = h;
          uniformData[2] = state.shaderTime;
          uniformData[3] = state.demoTime;

          uniformData[4] = state.beatPulse;
          uniformData[5] = state.bassEnergy;
          uniformData[6] = state.overdrive;
          uniformData[7] = state.speed;

          uniformData[8] = state.mouseX;
          uniformData[9] = state.mouseY;
          uniformData[10] = state.currentAct;
          uniformData[11] = state.prevAct;

          uniformData[12] = state.transitionBlend;
          uniformData[13] = state.transitionFlash;
          uniformData[14] = w / Math.max(1, h);
          uniformData[15] = frameIdx++;

          // Render Current Frame via WebGPU or WebGL2
          try {
            renderer.render(uniformData);
          } catch (renderErr) {
            // Silently recover on transient resize/context hiccups
          }

          // FPS Counter & Gentle Dynamic Resolution Scaling
          state.frameCount++;
          state.fpsAccumTime += rawDt;
          if (state.fpsAccumTime >= 0.35) {
            const measuredFps = Math.round(state.frameCount / state.fpsAccumTime);
            state.fps = measuredFps;
            fpsValueEl.textContent = String(measuredFps);

            if (measuredFps < 44 && state.resScale > 0.65) {
              state.lowFpsDuration += state.fpsAccumTime;
              state.highFpsDuration = 0;
              if (state.lowFpsDuration >= 1.2) {
                state.resScale = Math.max(0.65, Number((state.resScale - 0.1).toFixed(2)));
                state.lowFpsDuration = 0;
                updateCanvasSize();
              }
            } else if (measuredFps >= 57 && state.resScale < 1.0) {
              state.highFpsDuration += state.fpsAccumTime;
              state.lowFpsDuration = 0;
              if (state.highFpsDuration >= 2.4) {
                state.resScale = Math.min(1.0, Number((state.resScale + 0.05).toFixed(2)));
                state.highFpsDuration = 0;
                updateCanvasSize();
              }
            } else {
              state.lowFpsDuration = 0;
              state.highFpsDuration = 0;
            }

            state.frameCount = 0;
            state.fpsAccumTime = 0;
          }
        }

        requestAnimationFrame(frame);
      }

      window.addEventListener('load', bootEngine);
    })();
  </script>
</body>
